<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechLearn - Aprenda tecnologia</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="auth.js"></script>
</head>

<body>
    <div class="pagina">

        <header class="cabecalho">
        <a class="logo" href="index.html">
        <svg class="logo-icone" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/>
        </svg>
         <span class="logo-texto">Tech<span class="logo-destaque">Learn</span></span>
            </a>
            <nav class="menu">
                <a href="login.html" id="btn-entrar">Entrar</a>
                <a href="cadastro.html" id="btn-criar-conta">Criar conta</a>
            </nav>
        </header>

        <main>
            <section class="apresentacao">
                <h1>Aprenda tecnologia no seu ritmo</h1>

                <p>
                    Cursos de Python, Java, Banco de Dados e muito mais
                    com aulas em vídeo.
                </p>

                <form class="busca" id="form-busca">
                    <input
                        type="search"
                        id="campo-busca"
                        placeholder="Digite o nome do curso"
                        aria-label="Digite o nome do curso"
                    >

                    <button type="submit">Buscar</button>
                </form>
            </section>

            <section class="categorias" id="categorias">
            
                <h2>Explore nossos cursos: </h2>
                <h2>Categorias</h2>

                <div class="grade-categorias">
                    <a class="card-categoria" href="#lista-cursos"
                       data-categoria="python">
                        <h3>Python</h3>
                        <p>Do básico ao avançado</p>
                    </a>

                    <a class="card-categoria" href="#lista-cursos"
                       data-categoria="java">
                        <h3>Java</h3>
                        <p>Do básico ao avançado</p>
                    </a>

                    <a class="card-categoria" href="#lista-cursos"
                       data-categoria="banco de dados">
                        <h3>Banco de Dados</h3>
                        <p>Do básico ao avançado</p>
                    </a>
                </div>

                <p id="mensagem-busca" class="mensagem-busca"
                   aria-live="polite"></p>
            </section>

            <section class="lista-cursos" id="lista-cursos">
        

            <div class="grade-cursos"></div>
            </section>
        </main>

        <button class="botao-chat" id="botao-chat" type="button">
            <span aria-hidden="true">✦</span>
            Dúvidas? Fale com a IA
        </button>

    </div>

    <script src="js/app.js"></script>
    <script>
  (function () {
    function ir() {
      var campo = document.querySelector('input[type="text"], input[type="search"]');
      var t = campo ? campo.value.trim() : '';
      location.href = 'cursos.html' + (t ? '?busca=' + encodeURIComponent(t) : '');
    }
    document.addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (b && b.textContent.trim() === 'Buscar') { e.preventDefault(); e.stopPropagation(); ir(); }
    }, true);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target.matches('input[type="text"], input[type="search"]')) {
        e.preventDefault(); e.stopPropagation(); ir();
      }
    }, true);
  })();
</script>

    <script src="chatbot.js"></script>
</body>
</html>
