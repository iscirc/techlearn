<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar conta - TechLearn</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:#F1F5FB;color:#10203D;display:flex;min-height:100vh;flex-direction:column}
header{background:#0B3A78;padding:20px 32px}
header .marca{color:#fff;font-size:26px;font-weight:700;text-decoration:none}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.caixa{background:#fff;border:1px solid #C9D6EA;border-radius:14px;padding:32px;max-width:420px;width:100%;box-shadow:0 8px 24px rgba(16,32,61,.06)}
h1{margin:0 0 8px;color:#0B3A78;font-size:24px}
p.sub{margin:0 0 20px;color:#52617A;font-size:14px}
label{display:block;margin-top:14px;font-weight:600;font-size:14px}
input{width:100%;padding:11px 13px;border:1px solid #BFD0E8;border-radius:8px;font-size:15px;margin-top:6px}
input:focus{outline:2px solid #1F5FC8;border-color:#1F5FC8}
button{width:100%;padding:12px;margin-top:20px;border:0;border-radius:8px;background:#1F5FC8;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.rodape{margin-top:18px;text-align:center;font-size:14px;color:#52617A}
.rodape a{color:#1F5FC8;font-weight:600;text-decoration:none}
.msg{margin-top:14px;padding:10px 12px;border-radius:8px;font-size:14px;display:none}
.msg.erro{background:#FDECEC;color:#9B1C1C}
.msg.ok{background:#DEF7EC;color:#03543F}
@media (max-width: 600px) {
  header { padding: 16px 20px; text-align: center; }
  header .marca { font-size: 24px; }
  main { padding: 16px 14px; }
  .caixa { padding: 22px 18px; border-radius: 12px; }
  h1 { font-size: 20px; }
  p.sub { font-size: 13px; margin-bottom: 16px; }
  input { font-size: 16px; padding: 12px 14px; }
  button { padding: 13px; font-size: 16px; }
}
</style>
<script src="auth.js"></script>
</head>
<body>
<header><a class="marca" href="index.html">TechLearn</a></header>
<main>
  <div class="caixa">
    <h1>Crie sua conta</h1>
    <p class="sub">Gratuito para começar a aprender hoje mesmo.</p>
    <form id="form">
      <label>Nome completo<input type="text" id="nome" required autocomplete="name"></label>
      <label>E-mail<input type="email" id="email" required autocomplete="email"></label>
      <label>Senha (mínimo 6 caracteres)<input type="password" id="senha" minlength="6" required autocomplete="new-password"></label>
      <label>Confirme a senha<input type="password" id="senha2" minlength="6" required autocomplete="new-password"></label>
      <button type="submit" id="btn">Cadastrar</button>
    </form>
    <div id="msg" class="msg"></div>
    <div class="rodape">Já tem uma conta? <a href="login.html" id="link-entrar">Entrar</a></div>
  </div>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const voltar = destinoSeguro(params.get('voltar'));
  const linkEntrar = document.getElementById('link-entrar');
  if (voltar !== 'index.html') linkEntrar.href = 'login.html?voltar=' + encodeURIComponent(voltar);

  function mostrar(texto, tipo) {
    const m = document.getElementById('msg');
    m.innerHTML = texto;
    m.className = 'msg ' + tipo;
    m.style.display = 'block';
  }

  document.getElementById('form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const senha = document.getElementById('senha').value;
    if (senha !== document.getElementById('senha2').value) {
      mostrar('As senhas não são iguais.', 'erro');
      return;
    }
    const btn = document.getElementById('btn');
    btn.disabled = true;
    try {
      const r = await postJson('/auth/cadastro', {
        nome: document.getElementById('nome').value,
        email: document.getElementById('email').value,
        senha: senha
      });
      if (r.ok) {
        mostrar('Conta criada! Redirecionando para o login...', 'ok');
        setTimeout(function () {
          location.href = 'login.html?cadastro=ok&voltar=' + encodeURIComponent(voltar);
        }, 1200);
        return;
      }
      mostrar((r.dados && r.dados.erro) || 'Não foi possível criar a conta.', 'erro');
    } catch (err) {
      mostrar('Não foi possível conectar à API (' + API + '). <a href="javascript:void(0)" onclick="promptConfigurarApi()" style="color:#1F5FC8;text-decoration:underline;">Configurar URL</a>', 'erro');
    }
    btn.disabled = false;
  });
</script>
</body>
</html>
