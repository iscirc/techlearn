<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechLearn - Curso</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/curso.css">
    <script src="auth.js"></script>
    <script>exigirLogin();</script>
</head>

<body>
    <div class="pagina">

        <header class="cabecalho">
            <a class="logo" href="index.html">TechLearn</a>

            <nav class="menu">
                <a href="login.html" class="menu" id="btn-entrar">Entrar</a>
                <a href="cadastro.html" class="menu" id="btn-criar-conta">Criar conta</a>
            </nav>
        </header>

        <main class="pagina-curso">
            <a class="voltar" href="index.html">← Voltar aos cursos</a>

            <h1 id="titulo-curso">Carregando...</h1>
            <p id="descricao-curso"></p>
            <p id="mensagem-curso" class="mensagem-busca" aria-live="polite"></p>

            <div class="area-aulas">
                <div class="player">
                    <iframe id="player"
                            title="Vídeo da aula"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            referrerpolicy="strict-origin-when-cross-origin"
                            allowfullscreen></iframe>
                    <h2 id="titulo-aula"></h2>
                </div>

                <aside class="lista-aulas">
                    <h2>Aulas</h2>
                    <ol id="lista-aulas"></ol>
                </aside>
            </div>
        </main>

    </div>

    <script src="js/curso.js"></script>
    <script src="chatbot.js"></script>
</body>
</html>
